# Baut FED für Windows, macOS (Apple Silicon + Intel) und Linux.
#
#  - Per Klick:  Actions → "Build" → "Run workflow"  (Ergebnis unter "Artifacts" des Laufs)
#  - Release:    git tag v1.0.0 && git push origin v1.0.0
#                → baut alle Plattformen und legt ein GitHub-Release mit den Dateien an
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsbezeichnung (leer = aus fed/__init__.py)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["v1.0"]
    paths: [".github/workflows/build.yml", "packaging/**"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64,            os: windows-latest }
          - { name: macOS Apple Silicon,    os: macos-15 }
          - { name: macOS Intel,            os: macos-15-intel }
          - { name: Linux x64,              os: ubuntu-22.04 }   # ältere glibc = läuft auf mehr Distributionen
    env:
      FED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Nuitka-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ matrix.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-${{ matrix.os }}-

      - name: Bauen
        id: build
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: FED-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error

  validate:
    name: Validierung
    runs-on: ubuntu-latest
    env:
      FED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Dovecot
        run: |
          sudo apt-get update && sudo apt-get install -y dovecot-imapd
          sudo systemctl stop dovecot || true
      - name: Python-Pakete
        run: python -m pip install .
      - name: Validierung gegen das Testpostfach
        run: python -m validation.run --out validation-report --lang de,en
      - name: Dateien benennen
        if: always()
        run: |
          mkdir -p dist
          v="${FED_VERSION:-dev}"; v="${v#v}"
          for f in validation-report/*; do cp "$f" "dist/FED-$v-$(basename "$f")"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FED-validation
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
