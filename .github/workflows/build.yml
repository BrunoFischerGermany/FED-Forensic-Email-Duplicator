# Baut FED für Windows, macOS (Apple Silicon + Intel) und Linux, prüft jedes Programm
# (Selbsttest des heruntergeladenen Pakets) und validiert gegen das Testpostfach.
#
#  - Release:   auf GitHub unter "Releases → Draft a new release" einen Tag (z. B. v1.0.0) anlegen
#               und "Publish release" klicken → dieser Workflow baut alles und hängt die Programme,
#               SHA256SUMS.txt und das Validierungsprotokoll an das Release; die Ergebnistabelle der
#               Validierung wird an die Release-Notizen angefügt.
#  - Per Klick: Actions → "Build" → "Run workflow"  (Ergebnis unter "Artifacts" des Laufs)
#  - Nightly:   .github/workflows/nightly.yml ruft diesen Workflow auf
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsbezeichnung (leer = aus fed/__init__.py)"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  push:
    branches: ["main", "v1.0"]
    paths: [".github/workflows/build.yml", "packaging/**"]

permissions:
  contents: read

env:
  FED_VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64,            os: windows-latest }
          - { name: macOS Apple Silicon,    os: macos-15 }
          - { name: macOS Intel,            os: macos-15-intel }
          - { name: Linux x64,              os: ubuntu-22.04 }   # ältere glibc = läuft auf mehr Distributionen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Version setzen
        shell: bash
        run: python packaging/set_version.py "$FED_VERSION"

      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Nuitka-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ matrix.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-${{ matrix.os }}-

      - name: Bauen
        id: build
        run: python packaging/build.py

      # Prüft das Paket, das Nutzer herunterladen: entpacken, starten, Ordner, Programm-Hash,
      # Übersetzung, Qt, PDF und Case-Datei
      - name: Selbsttest des Pakets
        shell: bash
        run: python packaging/selftest.py "${{ steps.build.outputs.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FED-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error

  validate:
    name: Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Dovecot
        run: |
          sudo apt-get update && sudo apt-get install -y dovecot-imapd
          sudo systemctl stop dovecot || true
      - name: Version setzen
        run: python packaging/set_version.py "$FED_VERSION"
      - name: Python-Pakete
        run: python -m pip install .
      - name: Validierung gegen das Testpostfach
        run: |
          v="$(python -c 'import fed; print(fed.__version__)')"
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/FED-$v-validation-report-en.pdf"
          [ "${{ github.event_name }}" = "release" ] || url=""
          python -m validation.run --out validation-report --lang de,en --notes validation-notes.md --report-url "$url"
      - name: Dateien benennen
        if: always()
        run: |
          mkdir -p dist
          v="$(python -c 'import fed; print(fed.__version__)')"
          for f in validation-report/*; do cp "$f" "dist/FED-$v-$(basename "$f")"; done
          if [ -f validation-notes.md ]; then cp validation-notes.md dist/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FED-validation
          path: dist/*
          if-no-files-found: error

  # Nur bei einem veröffentlichten Release: Dateien anhängen, Validierung in die Notizen.
  # Schlägt Build, Selbsttest oder Validierung fehl, wird nichts angehängt.
  publish:
    if: github.event_name == 'release'
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        run: |
          mv dist/validation-notes.md notes.md
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          { echo; echo "## SHA-256"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> ../notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          body_path: notes.md
          append_body: true
