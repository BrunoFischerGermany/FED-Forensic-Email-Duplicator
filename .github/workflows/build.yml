# Baut FED für Windows, macOS (Apple Silicon + Intel) und Linux, prüft jedes Programm
# (Selbsttest des heruntergeladenen Pakets) und validiert gegen das Testpostfach.
#
#  - Release:   auf GitHub unter "Releases → Draft a new release" einen Tag (z. B. v1.0.0) anlegen
#               und "Publish release" klicken → dieser Workflow baut alles und hängt die Programme,
#               SHA256SUMS.txt und das Validierungsprotokoll an das Release; die Ergebnistabelle der
#               Validierung wird an die Release-Notizen angefügt.
#  - Per Klick: Actions → "Build" → "Run workflow", Version eintragen (z. B. 1.0.1), Häkchen
#               "Release erstellen" gesetzt lassen → Tag v1.0.1 auf dem gewählten Branch, Release mit
#               allen Programmen. Ohne Häkchen: nur Test-Build, Ergebnis unter "Artifacts" des Laufs.
#  - Nightly:   .github/workflows/nightly.yml ruft diesen Workflow auf
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z. B. 1.0.1 (Tag wird v1.0.1; für ein Release Pflicht)"
        required: false
        default: ""
      release:
        description: "Release erstellen (Tag + Release mit allen Programmen)"
        type: boolean
        default: true
      prerelease:
        description: "als Vorabversion (Pre-release) kennzeichnen"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  push:
    branches: ["main", "v1.0"]
    paths: [".github/workflows/build.yml", "packaging/**"]

permissions:
  contents: read

env:
  FED_VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  # Prüft vor dem (langen) Bauen, ob ein Release angelegt werden kann.
  check:
    name: Release prüfen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Tag bestimmen
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WANT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$WANT_RELEASE" = "true" ] || { echo "Nur Test-Build, kein Release."; exit 0; }
          v="${VERSION#v}"; v="${v#V}"
          if [ -z "$v" ]; then
            echo "::error::Für ein Release bitte eine Version eintragen (z. B. 1.0.1) – oder das Häkchen 'Release erstellen' entfernen."
            exit 1
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ungültige Version '$v' – erwartet z. B. 1.0.1 oder 1.1.0-rc1."
            exit 1
          fi
          tag="v$v"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Den Tag $tag gibt es schon. Bitte eine neue Version wählen oder den Tag vorher löschen."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Das Release $tag gibt es schon."
            exit 1
          fi
          echo "Release $tag wird nach erfolgreichem Build und Validierung angelegt (Commit ${GITHUB_SHA::7})."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    # Linux: in einem Container bauen (packaging/linux/container-build.sh). Die glibc des Containers
    # bestimmt, auf welchen Distributionen FED läuft (ältere glibc = mehr Systeme) – unabhängig davon,
    # welche Ubuntu-Versionen GitHub als Runner anbietet (ubuntu-22.04 nur noch bis ca. April 2027).
    # docker run --network host statt Job-Container: dessen Netz (DNS, Launchpad) war unzuverlässig.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64,            os: windows-latest }
          - { name: macOS Apple Silicon,    os: macos-15 }
          - { name: macOS Intel,            os: macos-15-intel }
          - { name: Linux x64,              os: ubuntu-24.04, docker: "ubuntu:22.04" }   # glibc 2.35
    steps:
      - uses: actions/checkout@v5

      # Windows/macOS: Python von GitHub; Linux bringt Python im Container mit (deadsnakes)
      - uses: actions/setup-python@v6
        if: ${{ !matrix.docker }}
        with:
          python-version: "3.14"
          cache: pip

      - name: Version setzen
        if: ${{ !matrix.docker }}
        shell: bash
        run: python packaging/set_version.py "$FED_VERSION"

      - name: Python-Pakete
        if: ${{ !matrix.docker }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Nuitka-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ matrix.os }}${{ matrix.docker }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-${{ matrix.os }}${{ matrix.docker }}-

      - name: Bauen
        id: build
        if: ${{ !matrix.docker }}
        run: python packaging/build.py

      # Prüft das Paket, das Nutzer herunterladen: entpacken, starten, Ordner, Programm-Hash,
      # Übersetzung, Qt, PDF und Case-Datei
      - name: Selbsttest des Pakets
        if: ${{ !matrix.docker }}
        shell: bash
        run: python packaging/selftest.py "${{ steps.build.outputs.archive }}"

      # Linux: Bauen und Selbsttest im Container (gleicher Pfad wie auf dem Runner)
      - name: Bauen und Selbsttest (Linux-Container)
        id: build_linux
        if: ${{ matrix.docker }}
        env:
          IMAGE: ${{ matrix.docker }}
        run: |
          mkdir -p ~/.cache/Nuitka
          docker run --rm --network host \
            -e FED_VERSION -e GITHUB_OUTPUT=/gh_output -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$GITHUB_OUTPUT:/gh_output" -v "$HOME/.cache/Nuitka:/root/.cache/Nuitka" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$IMAGE" bash packaging/linux/container-build.sh

      - uses: actions/upload-artifact@v6
        with:
          name: FED-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.build.outputs.archive || steps.build_linux.outputs.archive }}
          if-no-files-found: error

  validate:
    name: Validierung
    needs: check
    runs-on: ubuntu-24.04   # Dovecot 2.3 – Ubuntu 26.04 bringt Dovecot 2.4 mit anderem Konfigurationsformat
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Dovecot
        run: |
          sudo apt-get update && sudo apt-get install -y dovecot-imapd
          sudo systemctl stop dovecot || true
      - name: Version setzen
        run: python packaging/set_version.py "$FED_VERSION"
      - name: Python-Pakete
        run: python -m pip install .
      - name: Validierung gegen das Testpostfach
        run: |
          v="$(python -c 'import fed; print(fed.__version__)')"
          tag="${{ needs.check.outputs.tag }}"
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/FED-$v-validation-report-en.pdf"
          [ -n "$tag" ] || url=""
          python -m validation.run --out validation-report --lang de,en --notes validation-notes.md --report-url "$url"
      - name: Dateien benennen
        if: always()
        run: |
          mkdir -p dist
          v="$(python -c 'import fed; print(fed.__version__)')"
          for f in validation-report/*; do cp "$f" "dist/FED-$v-$(basename "$f")"; done
          if [ -f validation-notes.md ]; then cp validation-notes.md dist/; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: FED-validation
          path: dist/*
          if-no-files-found: error

  # Bei einem veröffentlichten Release oder "Run workflow" mit Häkchen: Programme anhängen,
  # Validierung in die Notizen. Schlägt Build, Selbsttest oder Validierung fehl, wird nichts
  # angehängt bzw. kein Release angelegt – ein Release ohne Programme gibt es so nicht.
  publish:
    if: needs.check.outputs.tag != ''
    needs: [check, build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Tag + Release anlegen, Dateien anhängen
      pull-requests: read    # automatische PR-Liste in den Release-Notizen
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        run: |
          mv dist/validation-notes.md notes.md
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          { echo; echo "## SHA-256"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> ../notes.md

      # Mit der GitHub-CLI wie im Nightly-Workflow (dort klappt das Anlegen mit GITHUB_TOKEN).
      # Die automatische PR-Liste braucht Lesezugriff auf Pull Requests; schlägt sie trotzdem
      # fehl, wird das Release ohne PR-Liste angelegt statt den Lauf abzubrechen.
      - name: Release anlegen bzw. Dateien anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ inputs.prerelease == true }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            # Release gibt es schon (auf GitHub veröffentlicht): Dateien anhängen, Notizen ergänzen
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
            { echo; cat notes.md; } >> body.md
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FED $TAG" --notes-file notes.md)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          if ! gh release create "$TAG" "${args[@]}" --generate-notes dist/*; then
            echo "::warning::Release mit automatischer PR-Liste fehlgeschlagen – neuer Versuch ohne PR-Liste."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" "${args[@]}" dist/*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url

      - name: Alle Programme angehängt?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$names"
          for p in windows-x64 macos-arm64 macos-x64 linux-x64 SHA256SUMS validation-report; do
            echo "$names" | grep -qi -- "$p" || { echo "::error::Im Release fehlt: $p"; exit 1; }
          done
