name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 fest: Ubuntu 26.04 (neues ubuntu-latest) bringt Dovecot 2.4 mit anderem
        # Konfigurationsformat – das Testpostfach ist für Dovecot 2.3 eingerichtet
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dovecot für Integrationstests (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dovecot-imapd libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo systemctl stop dovecot || true
      - run: pip install -e ".[dev]"
      - run: ruff check src tests validation
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
