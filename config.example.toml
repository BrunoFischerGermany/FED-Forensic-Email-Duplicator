# FED - Konfiguration
# Kopieren nach config.toml (neben das Programm) und anpassen.
# Keine Passwörter oder Tokens in dieser Datei!

[agentur]
name    = "Muster Forensik GmbH"
adresse = "Musterstr. 1, 12345 Musterstadt"
logo    = "logo.png"            # PNG/JPG, relativ zum Programmordner; leer = kein Logo

[examiner]
name = ""                       # Vorbelegung, im Case änderbar

[case]
nummer_muster = "{jahr}-{lfd:04}"   # Vorschlag für neue Aktenzeichen
# Platzhalter: {jahr} = 2026, {jahr:2} = 26, {monat} = 03, {tag} = 09, {lfd:04} = 0001

[programm]
sprache          = "de"         # de | en
bericht_sprache  = ""           # leer = wie Oberfläche, sonst de | en
bericht_mailliste     = "auto"  # Bericht: liste = Ordnerstruktur + Mail-Liste, ordner = nur Ordnerstruktur
                                #         mit Anzahl (Liste in log.csv), auto = Liste nur bis zur Grenze
bericht_mailliste_max = 500     # bei auto: Liste nur bis zu so vielen Mails
design           = "system"     # system | hell | dunkel
zielpfad         = ""           # leer = Laufwerk des Programms
ntp              = true         # Zeitabgleich beim Start
ntp_server       = "ptbtime1.ptb.de"
hash_extra       = ["md5", "sha512"]   # zusätzlich zu SHA-256
zip_zeit_quelle  = "internaldate"      # internaldate | date_header
socket_timeout_s = 30
chunk_mb         = 10           # große Mails stückweise laden ab dieser Größe
verbindungen     = 3            # gleichzeitige IMAP-Verbindungen beim Download (1–10; Anbieter begrenzen das)
dkim_pruefen = true               # DKIM-Signaturen bei der Sicherung prüfen, DNS-Schlüssel aufbewahren
leerzeichen_ersetzen = true       # Leerzeichen in Case-Ordner- und Dateinamen durch _ ersetzen (neue Cases)
verschluesselung = "fragen"       # verschlüsselte Kopie (AES-256) für die Weitergabe beim Abschluss: fragen | aus
zip_aufteilung = "fragen"         # mehrere Konten: fragen (beim 2. Konto) | gesamt (ein ZIP) | je_konto
arbeitsordner_loeschen = "fragen"  # nach verifiziertem ZIP work/ löschen: fragen | ja | nein
wach_halten      = true         # Ruhezustand/Bildschirmsperre während Sicherung und Abschluss verhindern

[proxy]
url = ""                        # z. B. "http://proxy.behoerde.local:8080" oder "socks5://..."

[zeitstempel]
tsa_url = ""                    # RFC-3161-Zeitstempeldienst für den ZIP-Hash, leer = aus
                                # z. B. "https://freetsa.org/tsr" (kostenlos, nicht qualifiziert);
                                # für gerichtsfeste Zeitstempel einen qualifizierten Dienst (eIDAS) eintragen

[oauth.google]
client_id     = ""
client_secret = ""              # bei Google-Desktop-Apps vorgesehen, gilt nicht als geheim
# Einrichtung: im Programm unter Einstellungen → Google / Microsoft 365 → Anleitung

[oauth.microsoft]
client_id = ""
tenant    = "organizations"     # Arbeits-/Schulkonten; "common" = auch Outlook.com; oder Tenant-ID
